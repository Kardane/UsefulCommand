name: Publish Modrinth release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download GitHub release JAR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'karns_UsefulCommand-*.jar' --dir release
      - name: Publish and verify Modrinth version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/publish_modrinth.py release
